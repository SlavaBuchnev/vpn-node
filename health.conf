server {
    listen 9090 default_server;
    listen [::]:9090 default_server;
    server_name _;

    access_log off;
    error_log /dev/null;
    server_tokens off;

    location = /ping {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "OK";
    }

    location / {
        return 404;
    }
}