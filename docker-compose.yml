services:
  amnezia-wg-easy:
    image: rylorin/amnezia-wg-easy:latest
    container_name: amnezia-wg-easy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${PASSWORD_HASH}
      - WG_PORT=51820
      - PORT=8080
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1, 8.8.8.8
      - WG_ALLOWED_IPS=0.0.0.0/0
      - UI_TRAFFIC_STATS=true
      - WG_ENABLE_ONE_TIME_LINKS=true
    volumes:
      - ./config:/etc/amnezia/amneziawg
    ports:
      - "51820:51820/udp"
      - "8080:8080/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    logging:
      driver: "none"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: awg-nginx
    ports:
      - "9090:9090/tcp"
    volumes:
      - ./health.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - amnezia-wg-easy
    logging:
      driver: "none"
    restart: unless-stopped